
name: Deploy VINILI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Scarica i file
        uses: actions/checkout@v4

      - name: Installa Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze
        run: npm install

      - name: Compila VINILI
        run: npm run build

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Prepara il sito
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Pubblica VINILI
        id: deployment
        uses: actions/deploy-pages@v4
